# pytest.ini
[pytest]
# Pass default Playwright flags automatically
addopts = --headed --screenshot off -n 3 --tracing retain-on-failure --html=report.html
#addopts = --screenshot off

# Define a custom base URL
base_url = https://rahulshettyacademy.com
markers =
	smoke: run the QA environment
	; regression: run the UAT environment
    ; functional: run the QA 
	; feature: run the QA environment