name: Playwright Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Flake8
      run: pip install flake8
    - name: Run Lint Check
      # continue-on-error: true ensures that syntax/style warnings don't stop the pipeline
      continue-on-error: true
      run: |
        echo "Running linting checks..."
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    name: Execute Playwright Tests (shard ${{ matrix.shard }}/3)
    needs: quality-check
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-playwright pytest-xdist pytest-rerunfailures pytest-html pytest-split
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Install Playwright Browsers
      run: playwright install --with-deps
    - name: Run Playwright tests
      run: pytest -s -n 0 --splits 3 --group ${{ matrix.shard }}
    - name: Upload test report and traces
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-shard-${{ matrix.shard }}
        path: |
          report.html
          test-results/
        if-no-files-found: warn

  post-execution:
    name: Post Execution Notification
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Success Message
      if: needs.test.result == 'success'
      run: echo "test ran succsfully"
    - name: Failure Message
      if: needs.test.result == 'failure'
      run: echo "test run failed"
