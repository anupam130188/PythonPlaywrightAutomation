name: Playwright Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Flake8
      run: pip install flake8
    - name: Run Lint Check
      # continue-on-error: true ensures that syntax/style warnings don't stop the pipeline
      continue-on-error: true
      run: |
        echo "Running linting checks..."
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    name: Execute Playwright Tests
    needs: quality-check
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-playwright pytest-xdist pytest-rerunfailures pytest-html pytest-split
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi    - name: Install Playwright Browsers      run: playwright install --with-deps
    - name: Run Playwright tests
      run: pytest -s test_playwright_e2e_framework.py

  post-execution:
    name: Post Execution Notification
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Success Message
      if: needs.test.result == 'success'
      run: echo "test ran succsfully"
    - name: Failure Message
      if: needs.test.result == 'failure'
      run: echo "test run failed"
